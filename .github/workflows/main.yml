name: 签到 # yml文件名

on:
  workflow_dispatch:
  schedule:   
    # https://crontab.guru/
    # UTC 时间，中国时区应减 8
    #         ┌────────── minute (0 - 59)
    #         │ ┌──────── hour (0 - 23)
    #         │ │ ┌────── day of the month (1 - 31)
    #         │ │ │ ┌──── month (1 - 12 or JAN-DEC)
    #         │ │ │ │ ┌── day of the week (0 - 6 or SUN-SAT)
    #         │ │ │ │ │
    - cron: '0 0 * * *'

jobs:
  run-check-in: # 任务名
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          
      - name: 安装依赖  
        run: |
          npm install

      - name: 运行签到
        run: |
          node ./index.js '${{ secrets.XYB }}'

      - name: 设置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: 安装Python依赖
        run: |
          pip install smtplib email

      - name: 发送签到结果邮件
        run: |
          echo "sign_result='签到成功！\n重新签到完成！\n周报已填写！'" > send_email.py
          cat <<EOL >> send_email.py
import smtplib
from email.mime.text import MIMEText
from email.header import Header

# 邮件配置
smtp_server = "smtp.qq.com"  # QQ邮箱SMTP服务器地址
smtp_port = 465  # SMTP服务器端口号
sender_email = "${{ secrets.SENDER_EMAIL }}"  # 发送者邮箱
sender_password = "${{ secrets.SENDER_PASSWORD }}"  # 授权码
receiver_emails = ["${{ secrets.RECEIVER_EMAILS }}"]  # 接收者邮箱列表

# 创建MIMEText对象
msg = MIMEText(sign_result, 'plain', 'utf-8')
msg['From'] = Header(sender_email)
msg['To'] = Header(",".join(receiver_emails))
msg['Subject'] = Header('签到结果通知')

try:
    # 连接到SMTP服务器
    server = smtplib.SMTP_SSL(smtp_server, smtp_port)
    server.login(sender_email, sender_password)

    # 发送邮件
    server.sendmail(sender_email, receiver_emails, msg.as_string())
    print("邮件发送成功")
except Exception as e:
    print(f"邮件发送失败: {e}")
finally:
    server.quit()
EOL
          python send_email.py
